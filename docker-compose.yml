services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brainbytes-frontend

    ports:
      - "8080:3000"

    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
      - NODE_ENV=development

    depends_on:
      - backend

    restart: unless-stopped

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

    dns:
      - 8.8.8.8
      - 1.1.1.1


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brainbytes-backend

    command: npm start

    ports:
      - "4000:4000"
      - "9080:9080"
      - "8082:8082"

    environment:
      - PORT=4000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/brainbytes_test
      - JWT_SECRET=brainbytes-local-secret
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}

    depends_on:
      mongo:
        condition: service_healthy

    restart: unless-stopped

    volumes:
      - ./backend:/app
      - /app/node_modules

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3

    dns:
      - 8.8.8.8
      - 1.1.1.1


  mongo:
    image: mongo:4.4
    container_name: brainbytes-mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    restart: unless-stopped

    mem_limit: 512m
    cpus: 0.75

    healthcheck:
      test:
        [
          "CMD",
          "mongo",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 30s
      timeout: 10s
      retries: 5


  prometheus:
    image: prom/prometheus:v2.43.0
    container_name: brainbytes-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    depends_on:
      - backend
      - node-exporter
      - cadvisor

    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    container_name: brainbytes-grafana

    ports:
      - "3001:3000"

    depends_on:
      - prometheus

    volumes:
      - grafana-data:/var/lib/grafana

    restart: unless-stopped


  node-exporter:
    image: prom/node-exporter:v1.5.0
    container_name: brainbytes-node-exporter

    ports:
      - "9100:9100"

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"

    restart: unless-stopped


  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.45.0
    container_name: brainbytes-cadvisor

    ports:
      - "8081:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

    restart: unless-stopped


  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: brainbytes-alertmanager

    ports:
      - "9093:9093"

    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

    restart: unless-stopped


volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
  frontend_node_modules:
  frontend_next: