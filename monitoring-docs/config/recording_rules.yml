groups:
  - name: brainbytes_recording_rules
    interval: 30s
    rules:

      # Recording Rule 1: Average AI response time over 5 minutes
      # Precomputes the per-category average so dashboards load faster.
      # PromQL to query: job:brainbytes_ai_response_duration_seconds:avg5m
      - record: job:brainbytes_ai_response_duration_seconds:avg5m
        expr: |
          rate(brainbytes_ai_response_duration_seconds_sum[5m])
          /
          rate(brainbytes_ai_response_duration_seconds_count[5m])

      # Recording Rule 2: HTTP error rate over 5 minutes
      # Ratio of 4xx/5xx responses to total requests per endpoint.
      # PromQL to query: job:brainbytes_http_error_rate:5m
      - record: job:brainbytes_http_error_rate:5m
        expr: |
          sum by (endpoint) (
            rate(brainbytes_http_requests_total{status=~"4..|5.."}[5m])
          )
          /
          sum by (endpoint) (
            rate(brainbytes_http_requests_total[5m])
          )
