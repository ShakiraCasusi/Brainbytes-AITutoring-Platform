global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - 'alert_rules.yml'
  - 'recording_rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'brainbytes-backend'
    scrape_interval: 5s
    scrape_timeout: 4s
    sample_limit: 1000
    static_configs:
      - targets: ['backend:9080']

  - job_name: 'node-exporter'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    scrape_interval: 10s
    scrape_timeout: 8s
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'alertmanager'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['alertmanager:9093']
