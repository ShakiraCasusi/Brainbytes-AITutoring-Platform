groups:
  - name: BrainBytes Alerts
    rules:

      # ── SYSTEM ALERTS ───────────────────────────────────────────────────────────
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for 5 minutes on {{ $labels.instance }}."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 85% for 5 minutes on {{ $labels.instance }}."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space detected"
          description: "Disk space is below 15% on {{ $labels.instance }} at {{ $labels.mountpoint }}."

      # ── APPLICATION ALERTS ───────────────────────────────────────────────────────
      - alert: HighErrorRate
        expr: sum(rate(brainbytes_http_requests_total{status=~"5.*"}[5m])) / sum(rate(brainbytes_http_requests_total[5m])) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for 2 minutes."

      - alert: SlowResponses
        expr: histogram_quantile(0.95, rate(brainbytes_http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow response times detected"
          description: "95th percentile of response time is above 2 seconds for 5 minutes."

      - alert: ContainerHighMemoryUsage
        expr: container_memory_usage_bytes{name=~"brainbytes-.*"} / container_spec_memory_limit_bytes{name=~"brainbytes-.*"} * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container high memory usage"
          description: "Container {{ $labels.name }} memory usage is above 85% for 5 minutes."

      # ── BUSINESS ALERTS ─────────────────────────────────────────────────────────
      - alert: NoActiveSessions
        expr: brainbytes_active_sessions == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No active sessions"
          description: "There have been no active tutoring sessions for 30 minutes during business hours."

      - alert: HighAIResponseTime
        expr: rate(brainbytes_ai_response_duration_seconds_sum[5m]) / rate(brainbytes_ai_response_duration_seconds_count[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow AI responses"
          description: "AI is taking more than 5 seconds on average to respond to questions."

      # ── PHILIPPINE CONTEXT ALERTS ─────────────────────────────────────────────────
      - alert: NetworkInstability
        expr: rate(brainbytes_connection_drops_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Network instability detected"
          description: "High rate of connection drops detected, which could affect users with intermittent connectivity."

      - alert: SlowMobileResponses
        expr: histogram_quantile(0.95, rate(brainbytes_http_request_duration_seconds_bucket{user_agent=~".*Mobile.*"}[5m])) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow mobile response times"
          description: "95th percentile of mobile response time is above 3 seconds for 5 minutes."

      - alert: HighDataUsage
        expr: sum(rate(brainbytes_response_size_bytes_sum[1h])) > 52428800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High data usage detected"
          description: "Application is sending more than 50MB of data per hour, which may impact users with limited data plans."
