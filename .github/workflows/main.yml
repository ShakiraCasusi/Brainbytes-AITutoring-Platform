name: BrainBytes CI/CD

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v2
      
      # Cache Node.js dependencies
      - name: Cache Node.js dependencies
        uses: actions/cache@v2
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'
          cache: 'npm'
      
      # Frontend dependencies
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      # Backend dependencies
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      # Configure ESLint
      - name: Run ESLint
        run: |
          npm run lint:js -- --format json --output-file eslint-report.json || true
          
      - name: Annotate ESLint results
        uses: ataylorme/eslint-annotate-action@v2
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          report-json: "eslint-report.json"

      # Check formatting with Prettier
      - name: Check formatting with Prettier
        run: npx prettier --check "**/*.{js,jsx,ts,tsx,json,css,md}" || echo "Prettier formatting check failed but continuing workflow"

      # Dependency vulnerability scanning
      - name: Check for vulnerabilities
        run: npm audit --json || true
        
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
  
  build:
    name: Build Docker Images
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v2
      
      # Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      
      - name: Build frontend image
        uses: docker/build-push-action@v2
        with:
          context: ./frontend
          push: false
          tags: brainbytes/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build backend image
        uses: docker/build-push-action@v2
        with:
          context: ./backend
          push: false
          tags: brainbytes/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker Compose
        run: |
          docker-compose -f docker-compose.yml up -d
          docker-compose ps
          docker-compose down

      # Save build artifacts
      - name: Save build artifacts
        uses: actions/upload-artifact@v2
        with:
          name: build-outputs
          path: |
            frontend/build
            backend/dist
          if-no-files-found: ignore
  
  test:
    name: Run Tests
    needs: build
    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v2
      
      # Download build artifacts
      - name: Download build artifacts
        uses: actions/download-artifact@v2
        with:
          name: build-outputs

      # Cache Node.js dependencies
      - name: Cache Node.js dependencies
        uses: actions/cache@v2
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Set up Node.js with Matrix versions
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      
      # Frontend tests
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test
      
      # Backend tests
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run backend tests
        working-directory: ./backend
        run: npm test

      # Code Coverage
      - name: Run backend tests with coverage
        working-directory: ./backend
        run: npm run test:coverage || echo "Coverage run failed but continuing"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v2
        with:
          name: coverage-reports
          path: |
            backend/coverage
            frontend/coverage
          if-no-files-found: ignore

      # E2E Tests
      - name: Install Playwright browsers
        run: npx playwright install --with-deps || echo "Playwright not required or installed"

      - name: Run E2E tests
        working-directory: ./tests
        run: npm run test || echo "E2E tests failed but continuing workflow"
        continue-on-error: true

  notify:
    name: Pipeline Status Notifications
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: "BrainBytes Pipeline Result"
          SLACK_MESSAGE: "Pipeline runs completed. Lint, Build, and Tests status check finished."
          SLACK_COLOR: ${{ contains(needs.*.result, 'failure') && 'danger' || 'good' }}
        continue-on-error: true
