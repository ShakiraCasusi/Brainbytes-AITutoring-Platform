# .github/workflows/deploy.yml
name: BrainBytes Deploy

on:
  push:
    branches: [main, development]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Railway.app
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Build Docker images
        run: docker compose build
      
      - name: Prepare deployment environment variables
        run: |
          echo "DEPLOY_TIME=$(date)" >> $GITHUB_ENV
          echo "DEPLOY_SHA=${{ github.sha }}" >> $GITHUB_ENV
      
      - name: Install Railway CLI
        run: npm install -g @railway/cli
        if: ${{ secrets.RAILWAY_TOKEN != '' }}
      
      - name: Deploy Frontend Service to Railway
        run: |
          echo "Deploying frontend container service to Railway..."
          railway deploy --service brainbytes-frontend --prod --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        working-directory: ./frontend
        if: ${{ secrets.RAILWAY_TOKEN != '' }}

      - name: Deploy Backend Service to Railway
        run: |
          echo "Deploying backend container service to Railway..."
          railway deploy --service brainbytes-backend --prod --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        working-directory: ./backend
        if: ${{ secrets.RAILWAY_TOKEN != '' }}

      - name: Simulation mode deployment (Fallback)
        run: |
          echo "Warning: No production RAILWAY_TOKEN found. Operating in local simulation mode."
          echo "Building stack locally using docker-compose..."
          docker compose up -d
          docker compose ps
          docker compose down
        if: ${{ secrets.RAILWAY_TOKEN == '' }}

      - name: Verify deployment health
        run: |
          echo "Verifying service availability..."
          # In local simulation mode, check localhost, in Railway mode check Railway service URL
          TARGET_URL="http://localhost:4000/api/health"
          if [ -n "${{ secrets.RAILWAY_BACKEND_URL }}" ]; then
            TARGET_URL="${{ secrets.RAILWAY_BACKEND_URL }}/api/health"
          fi
          
          # Ping the backend health endpoint
          for i in {1..10}; do
            if curl -sf $TARGET_URL; then
              echo "BrainBytes backend is healthy and responding!"
              exit 0
            fi
            echo "Waiting for backend service to stand up ($i/10)..."
            sleep 5
          done
          echo "Error: Backend did not respond on $TARGET_URL"
          exit 1


