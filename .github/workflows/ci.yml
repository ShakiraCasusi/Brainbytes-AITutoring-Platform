name: BrainBytes CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test:
    name: Run Tests
    strategy:
      matrix:
        node-version: [18.x, 20.x]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:5
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # --- Frontend ---
      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

      # --- Backend ---
      - name: Set up Node.js for Backend
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Verify backend dependencies
        working-directory: ./backend
        run: |
          npm list node-fetch ws || true
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"

      - name: Wait for MongoDB to be ready
        run: |
          for i in {1..30}; do
            if node -e "const net = require('net'); const client = net.connect({ port: 27017 }, () => process.exit(0)); client.on('error', () => process.exit(1));" 2>/dev/null; then
              echo "MongoDB is ready"
              exit 0
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 1
          done
          echo "MongoDB failed to start"
          exit 1

      - name: Start backend server
        working-directory: ./backend
        run: |
          npm start > /tmp/server.log 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
        env:
          NODE_ENV: test
          PORT: 4000
          MONGO_URI: mongodb://localhost:27017/brainbytes

      # Poll the health endpoint instead of using a fixed sleep
      - name: Wait for server to be ready
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:4000/api/health > /dev/null 2>&1; then
              echo "Server is ready after ${i}s"
              exit 0
            fi
            echo "Waiting for server... ($i/60)"
            sleep 1
          done
          echo "Server failed to start within 60 seconds"
          echo "=== Server Startup Log ==="
          cat /tmp/server.log || echo "No server log found"
          exit 1

      # Jest uses mongodb-memory-server so no live DB needed for unit tests
      - name: Run backend unit tests
        working-directory: ./backend
        run: npm test
        env:
          NODE_ENV: test

      - name: Run backend tests with coverage
        working-directory: ./backend
        run: npm run test:coverage || echo "Coverage run failed but continuing"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-node-${{ matrix.node-version }}
          path: |
            backend/coverage
            frontend/coverage
          if-no-files-found: ignore

      # Integration test against the live server started above
      - name: Run backend integration tests
        working-directory: ./backend/tests
        run: |
          API_URL=http://localhost:4000/api node chat.test.js
        continue-on-error: true
        env:
          PORT: 4000