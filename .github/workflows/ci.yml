name: BrainBytes CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test:
    name: Run Tests
    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x]
        os: [ubuntu-latest]
    
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    # Spin up MongoDB service so mongoose.connect succeeds and server can start listening
    services:
      mongodb:
        image: mongo:5
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      # Cache Node.js dependencies
      - name: Cache Node.js dependencies
        uses: actions/cache@v3
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # --- FRONTEND ---
      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install
      
      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

      # --- BACKEND ---
      - name: Set up Node.js for Backend
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      # Start the backend server so the API is listening
      - name: Start backend server
        working-directory: ./backend
        run: npm start &
        env:
          NODE_ENV: test
          PORT: 4000
          MONGO_URI: mongodb://localhost:27017/brainbytes

      # Wait for the backend port to be responsive
      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:4000/api/health 2>/dev/null; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - name: Run backend tests
        working-directory: ./backend
        run: npm test

      # --- COVERAGE ---
      - name: Run backend tests with coverage
        working-directory: ./backend
        run: npm run test:coverage || echo "Coverage run failed but continuing"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            backend/coverage
            frontend/coverage
          if-no-files-found: ignore

      # --- END-TO-END TESTING ---
      - name: Install Playwright browsers
        run: npx playwright install --with-deps || echo "Playwright not required or installed"

      - name: Run E2E tests
        working-directory: ./backend/tests
        run: node chat.test.js
        continue-on-error: true
