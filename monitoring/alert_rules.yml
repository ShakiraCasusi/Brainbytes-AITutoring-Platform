groups:
  - name: BrainBytes Alerts
    rules:

      # ─────────────────────────────────────────────
      # SYSTEM & INFRASTRUCTURE ALERTS
      # ─────────────────────────────────────────────

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Monitored service is down"
          description: "One of the Monitored infrastructure services has been unreachable for more than 1 minute."

      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage is high"
          description: "Sustained CPU usage above 80% on {{ $labels.instance }}."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host memory usage is critical"
          description: "Host available RAM is below 15% on {{ $labels.instance }}."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host disk space is low"
          description: "Root disk storage space has dropped below 15%."

      - alert: ContainerRestarting
        expr: change_rate(container_last_seen{name=~"brainbytes-.*"}) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container restarting frequently"
          description: "Container {{ $labels.name }} has restarted multiple times."

      - alert: ContainerHighMemoryUsage
        expr: (container_memory_usage_bytes{name=~"brainbytes-.*"} / container_spec_memory_limit_bytes{name=~"brainbytes-.*"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Docker container memory is high"
          description: "Container {{ $labels.name }} is using >85% of its memory limit."

      # ─────────────────────────────────────────────
      # APPLICATION & NETWORK ALERTS
      # ─────────────────────────────────────────────

      - alert: HTTPErrorRateWarning
        expr: (sum(rate(brainbytes_http_requests_total{status=~"5.."}[5m])) / sum(rate(brainbytes_http_requests_total[5m]))) * 100 > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "HTTP error rate warning"
          description: "API server 5xx errors represent >5% of response traffic."

      - alert: HTTPErrorRateCritical
        expr: (sum(rate(brainbytes_http_requests_total{status=~"5.."}[5m])) / sum(rate(brainbytes_http_requests_total[5m]))) * 100 > 15
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP error rate critical"
          description: "API server 5xx errors represent >15% of response traffic."

      - alert: BackendMetricsDown
        expr: up{job="brainbytes-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend scrape metrics endpoint unreachable"
          description: "Prometheus cannot pull metrics from the backend metrics daemon port 9080."

      - alert: DBQuerySlowWarning
        expr: histogram_quantile(0.95, sum(rate(brainbytes_db_query_duration_seconds_bucket[5m])) by (le)) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "MongoDB p95 query speed is slow"
          description: "95% of MongoDB queries are slower than 100ms."

      - alert: DBQuerySlowCritical
        expr: histogram_quantile(0.95, sum(rate(brainbytes_db_query_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "MongoDB p95 query speed is critical"
          description: "95% of MongoDB queries are slower than 500ms."

      - alert: ServerErrorSpike
        expr: sum(rate(brainbytes_errors_total{severity="critical"}[1m])) > 0.5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical application error rate spike"
          description: "Rate of critical application errors exceeds 0.5 per second."

      # ─────────────────────────────────────────────
      # AI SERVICE ALERTS
      # ─────────────────────────────────────────────

      - alert: AIQueryErrorRateWarning
        expr: rate(brainbytes_ai_queries_total{status="error"}[5m]) / rate(brainbytes_ai_queries_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "AI queries failure rate warning"
          description: "More than 5% of HuggingFace hint queries failed."

      - alert: AIQueryErrorRateCritical
        expr: rate(brainbytes_ai_queries_total{status="error"}[5m]) / rate(brainbytes_ai_queries_total[5m]) > 0.20
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AI queries failure rate critical"
          description: "More than 20% of HuggingFace hint queries failed."

      - alert: AIResponseTimeWarning
        expr: histogram_quantile(0.95, rate(brainbytes_ai_response_duration_seconds_bucket[5m])) > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "HuggingFace API latency is slow"
          description: "95th percentile AI response generation duration exceeded 3s."

      - alert: AIResponseTimeCritical
        expr: histogram_quantile(0.95, rate(brainbytes_ai_response_duration_seconds_bucket[5m])) > 8
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HuggingFace API latency is critical"
          description: "95th percentile AI response generation duration exceeded 8s."

      # ─────────────────────────────────────────────
      # BUSINESS & PHILIPPINES CONTEXT ALERTS
      # ─────────────────────────────────────────────

      - alert: ChatExperienceDegradedWarning
        expr: histogram_quantile(0.90, rate(brainbytes_chat_end_to_end_duration_seconds_bucket[5m])) > 4
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Student chat p90 latency is slow"
          description: "90% of tutoring chat requests took longer than 4s."

      - alert: ChatExperienceCritical
        expr: histogram_quantile(0.90, rate(brainbytes_chat_end_to_end_duration_seconds_bucket[5m])) > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Student chat p90 latency is critical"
          description: "90% of tutoring chat requests took longer than 10s."

      - alert: AIServiceDegradation
        expr: (sum(rate(brainbytes_ai_queries_total{status="error"}[10m])) / sum(rate(brainbytes_ai_queries_total[10m]))) * 100 > 30
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Hugging Face tutoring service degraded"
          description: "Tutoring service error responses represent >30% of traffic over 10m."

      - alert: AuthFailureSpike
        expr: rate(brainbytes_auth_operations_total{status="failure"}[5m]) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Failed authentication spike"
          description: "Authentication failures exceed 1 request per second."

      - alert: NoActiveSessions
        expr: brainbytes_active_sessions == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No concurrent tutoring sessions"
          description: "Active student tutoring sessions flatlined at 0 for 30 minutes."

      - alert: NetworkInstability
        expr: rate(brainbytes_connection_drops_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High client connection drops detected"
          description: "Reconnection and drop metrics suggest severe local ISP cell packet loss."

      - alert: SlowMobileResponses
        expr: histogram_quantile(0.95, sum(rate(brainbytes_http_request_duration_seconds_bucket{user_agent=~".*Mobile.*"}[5m])) by (le)) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mobile client latency warning"
          description: "95th percentile mobile client API latency exceeded 3 seconds."

      - alert: HighDataUsage
        expr: sum(rate(brainbytes_response_size_bytes_sum[1h])) > 52428800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Outbound payload size high"
          description: "Payload transfer exceeds 50MB/hour, increasing prepaid mobile data costs."