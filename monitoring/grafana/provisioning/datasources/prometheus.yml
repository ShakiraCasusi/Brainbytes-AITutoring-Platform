global:
  scrape_interval: 15s
  evaluation_interval: 15s


rule_files:
  - "alert_rules.yml"


scrape_configs:

  # BrainBytes Backend Metrics
  - job_name: "brainbytes-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "backend:9080"


  # Docker Host Metrics
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"


  # Container Metrics
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"


  # Prometheus Self Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"


alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"