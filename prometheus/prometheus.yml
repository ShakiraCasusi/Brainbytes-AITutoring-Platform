global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'brainbytes-monitor'

rule_files:
  - "alert_rules.yml"
  - "recording_rules.yml"

scrape_configs:

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # System-level metrics (CPU, memory, disk, network)
  - job_name: "node-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "brainbytes-host"

  # Container-level metrics (per-container CPU, memory, network)
  - job_name: "cadvisor"
    scrape_interval: 15s
    static_configs:
      - targets: ["cadvisor:8080"]
    relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service

  # BrainBytes backend custom metrics
  - job_name: "brainbytes-backend"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:4000"]
        labels:
          app: "brainbytes"
          component: "backend"
          environment: "production"
    relabel_configs:
      - source_labels: [job]
        target_label: service
      - source_labels: [__name__]
        regex: "go_.*"
        action: drop